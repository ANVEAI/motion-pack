name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Headless checks that need no GPU. The browser tests (layers/tests/run-all.sh) and renders need a hardware GPU
    # and run locally; docs/testing.md lists what CI covers and what it cannot.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "ffmpeg"
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: "python packages"
        run: pip install -r requirements.txt
      - name: "cross-module ids resolve (code, config, data and Markdown)"
        run: python3 tools/check_ids.py --docs
      - name: "build the sound library (WAV masters are not in git; rebuilt from the recipes)"
        run: python3 sfx/build_library.py
      # The build rewrites sfx/manifest.json (every sound's sha) BEFORE the tests read it, so without this step a recipe change that the commit's manifest
      # does not reflect stays invisible. Shas are bit-exact per platform only (x86-64 Linux and arm64 macOS differ by one 24-bit LSB in most sounds), so
      # they are left out here; every measured field (anchors, peaks, loudness, durations) must match the commit exactly.
      - name: "the rebuilt sound manifest matches the commit (all measured fields; shas are per platform)"
        run: python3 tools/check_generated.py --ignore-field sha sfx/manifest.json
      - name: "sound QA (peaks, true peak, loudness, DC, edges, tails, loop seams, determinism vs the rebuilt manifest)"
        run: python3 sfx/qa.py
      - name: "build the music library (beds, stingers, sonic logos)"
        run: python3 music/build_music.py
      - name: "the rebuilt music manifest matches the commit byte for byte"
        run: python3 tools/check_generated.py music/manifest.json
      - name: "music QA (every bed, stinger and logo; python vs ffmpeg loudness)"
        run: python3 music/qa.py
      - name: "the layers / type / camera manifests match their generator"
        run: node layers/tests/make-manifests.mjs && python3 tools/check_generated.py layers/manifest.json type/manifest.json camera/manifest.json
      - name: "python tests (cuts, sfx, music, tools incl. the no-clock gate and the run-all / CI suite lists, cloud, blender recipes vs manifest, storyboard)"
        run: python3 -m pytest -q cuts/test_cutgen.py cuts/test_retime.py cuts/test_story45.py cuts/test_story6.py cuts/test_trailer_cuts.py sfx/tests music/tests tools/tests cloud/tests blender/tests storyboard/tests
      - name: "ears tests (automated listening, synthetic signals)"
        run: python3 -m pytest -q ears/tests
      - name: "storyboard mutation proof (each check in storyboard/tests fails when the code under test is broken - timeline, safe zone, reading speed, lint gate, panels, determinism, animatic frames and loudness, real key frames, sound intents)"
        run: for m in core checks board draw animatic real intents loudness; do python3 tools/mutation_check.py storyboard/tests/$m.mutants.json || exit 1; done
      - name: "eyes tests (automated looking, synthetic x264 clips for every check: flash rates, banding, safe zones, text, pacing, bars, encode)"
        run: python3 -m pytest -q eyes/tests
      - name: "eyes mutation proof (every check fails when the code under test is broken: frames, flashes, banding, text, edit, core, report)"
        run: for m in checks_frames checks_text checks_edit core report; do python3 tools/mutation_check.py eyes/tests/$m.mutants.json || exit 1; done
      - name: "transitions core tests"
        run: node transitions/tests/core.test.mjs
      - name: "transitions lint"
        run: node transitions/tools/lint.mjs
      - name: "every transition id resolves to a back-end that can play it (GL-only ids have a DOM approximation; node, no browser)"
        run: node transitions/tests/backends.test.mjs
      - name: "camera maths"
        run: node camera/tests/camera.test.mjs
      - name: "type DOM bake and drive agree for any t0 (node, fake timeline and elements)"
        run: node type/tests/dom-t0.test.mjs
      - name: "UI kit + closed-form springs (node, no browser)"
        run: node type/tests/ui.test.mjs
      - name: "round-3 type + layout parts (node, no browser)"
        run: node type/tests/r3.test.mjs
      - name: "round 4+5 proof parts (scatter frontier, branch trace, data table, scene bubble, cost ticker, readout, personal tag, prompt attach; node, no browser)"
        run: node type/tests/r45ui.test.mjs
      - name: "round-4/5 type parts (node, no browser)"
        run: node type/tests/r45type.test.mjs
      - name: "round-6 type parts (hover tooltip, dock launch, verb card, connect rows, degrading diagram, command pill; hostile params, seek order, two processes; node, no browser)"
        run: node type/tests/r6.test.mjs
      - name: "honesty defaults (every registered gfx part and layers kind, rendered with its defaults, shows no digit without a placeholder label; node, no browser)"
        run: node type/tests/honesty-defaults.test.mjs
      - name: "round-4/5 layers (Canvas2D on a recording context, node, no browser)"
        run: node layers/tests/r45.test.mjs
      - name: "round-6 layer (auroraRibbon on a recording context: rise, loop seam, grain, guards, seek order; node, no browser)"
        run: node layers/tests/r6.test.mjs
      - name: "round-6 story shape mutation proof (every check in cuts/test_story6.py fails when the code under test is broken; the layer's 30 mutants run locally, see tools/mutation_check.py)"
        run: python3 tools/mutation_check.py cuts/test_story6.mutants.json && python3 tools/mutation_check.py cuts/test_story6.cutgen.mutants.json
      - name: "problem-pivot demo template (plan from cuts/story6.py: gap, pivot frame, bass = the ribbon's cue, hold, committed plan current, same bytes in two processes; node + python, no browser)"
        run: node templates/demo-r6-pivot/pivot.test.mjs
      - name: "problem-pivot demo mutation proof (each check fails when config.mjs is broken)"
        run: python3 tools/mutation_check.py templates/demo-r6-pivot/pivot.mutants.json
      - name: "ears brand_launch role mutation proof"
        run: python3 tools/mutation_check.py ears/tests/brand_launch.manifest.mutants.json && python3 tools/mutation_check.py ears/tests/brand_launch.checks.mutants.json
      - name: "gfx def ids never collide (two items of every id in one host; node, no browser)"
        run: node type/tests/ids.test.mjs
      - name: "no part hangs or exhausts memory on 0, -1, NaN, Infinity, 1e9 or 1e-6 params (every gfx id, Canvas2D kind and background; node, watchdog per render)"
        run: node tools/tests/fuzz-params.test.mjs
      - name: "cross-process determinism (every gfx id, Canvas2D kind, background, camera preset, type preset and caption style hash the same in two fresh processes with different call histories)"
        run: node tools/tests/xproc-hash.test.mjs
      - name: "every template with a config builds its plan without a browser, passes its lints, and matches the committed out/plan.json"
        run: node tools/tests/template-plans.test.mjs
      - name: "the shared project file (templates/_shared/project.mjs): loader errors name the field, every PROJECT_MAP lands on a real CONFIG path, and an empty project builds the identical plan for every genre template (node, no browser)"
        run: node tools/tests/project.test.mjs
      - name: "proof film template (honesty gate: a number without source or method fails the build; plan, camera, safe zone, VO mechanics; node + python, no browser)"
        run: node templates/proof-film/proof-film.test.mjs
      - name: "human kit (lane human: subtitles to words, fillers, breath-keeping autocut, cursor and zoom-follow, punch-ins, B-roll slots, active speaker, captions, placeholder labels, the five human templates at both aspects; node, no browser)"
        run: node templates/_shared/human/human.test.mjs
      - name: "explainer templates (explainer-diagram, data-story, process-howto: graph layout determinism, honesty gates exit 2, footers on every chart frame, plans current, structure >= 70, voice anchors, labelled media; node, no browser)"
        run: node templates/_explain/explain.test.mjs
      - name: "hardware templates (hardware-reveal, hardware-teaser, spec-sheet: plans pure, bar grid, drop on the reveal, tracks in frame, text in the safe rect, claims sourced, lint gate; explode, projection, die table; node, no browser)"
        run: node templates/_hw/hw.test.mjs
      - name: "film layers (filmBurn, anamorphicFlare, gate weave, flicker, halation / ink filters, genre looks and their generated cubes; node, no browser)"
        run: node layers/tests/film.test.mjs
      - name: "film type parts (trailer titles, billing block, credits roll, cards, quote needs a source, subtitles, opening names; node, no browser)"
        run: node type/tests/film.test.mjs
      - name: "trailer template (every cut, aspect and score: lengths, the half-beat grid, acceleration, act-3 downbeats, the silence, the title on the hit; node, no browser)"
        run: node templates/trailer/trailer.test.mjs
      - name: "title-sequence template (every genre, aspect and length: names on beats, one at a time, the title then directed by; node, no browser)"
        run: node templates/title-sequence/title-sequence.test.mjs
      - name: "short-film template (scenes, chapters, slugs, scene-relative subtitles, J / L sound, credits roll, the stage slot, the voice; node, no browser)"
        run: node templates/short-film/short-film.test.mjs
      - name: "SaaS kit parts (app window + zoom, cursor journey, callouts, command bar, AI answer, shortcut chip, pricing, integrations, before / after, toasts, dashboard, device mock; node, no browser)"
        run: node type/tests/saas.test.mjs
      - name: "SaaS templates (saas-launch, saas-feature-drop, saas-explainer: both aspects, every length, safe zones, honesty gate, media slots, VO breaths; node, no browser)"
        run: node templates/_shared/saas/saas-templates.test.mjs
      - name: "physics table player (the baked table is committed; no npm install)"
        run: node physics/tests/test-player.mjs
      - name: "blender scripts compile (no Blender on CI; renders are tested locally with blender/tests/smoke.sh)"
        run: python3 -m compileall -q blender
      - name: "no studied account or brand name outside docs/research (hashed denylist; the names themselves are never in the repo)"
        run: python3 tools/check_names.py
      - name: "structure check (every genre template plan scored against its beat sheet in patterns/structures.json, or reported with a reason)"
        run: python3 tools/structure_check.py --all
      - name: "structure check mutation proof (each scoring rule fails its test when broken)"
        run: python3 tools/mutation_check.py tools/tests/structure_check.mutants.json
      - name: "README counts are current"
        run: python3 tools/count.py --check
      - name: "catalog media all resolve"
        run: python3 tools/pages_site.py "$RUNNER_TEMP/site"
