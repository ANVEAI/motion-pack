<!doctype html><html><head><meta charset="utf-8"><title>motion-pack type demo</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
/* Type demo: kinetic presets + caption engine drawn with the 2D renderer (the same pure state functions the DOM path bakes into GSAP).
   Page contract: window.__ready, window.tile(spec, t, o), window.sheet(rows, times, o), window.capSheet(styles, times, o), window.captionRect(...).  Fonts: Manrope variable via a read-only mount (tests only). */
import { drawType, drawCaptions, layout } from '../render-canvas.js'; import { PRESETS, PRESET_IDS, holdTime } from '../presets.js'; import { chunkWords, CAPTION_STYLES, captionFrame } from '../captions.js'; import { captionBox, safeRect, SAFE } from '../safezones.js'; import { ICONS, drawIcon } from '../icons.js';
const ff = new FontFace('Manrope', 'url(/ext/kitfonts/Manrope-Variable.ttf)', { weight: '200 800' }); try { await ff.load(); document.fonts.add(ff); } catch (e) { console.warn('font load failed', e); }
const BG = { cream: ['#f4efe6', '#e6dccb', '#111111'], dark: ['#0d1020', '#1b1f3a', '#ffffff'], violet: ['#4a18ed', '#2b0f99', '#ffffff'], photo: ['#6c7a99', '#c9b9a3', '#ffffff'] };
function plate(g, W, H, bg) { const [a, b] = BG[bg || 'cream'], gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
window.tile = (spec, t, { W = 1280, H = 720, bg = 'cream' } = {}) => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); plate(g, W, H, bg); drawType(g, { color: BG[bg][2], ...spec }, t, { W, H }); return c; };
const label = (g, x, y, s) => { g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(x, y, g.measureText(s).width + 12, 18); g.fillStyle = '#fff'; g.font = '12px monospace'; g.fillText(s, x + 6, y + 13); };
window.sheet = (rows, times, { W = 640, H = 360, bg = 'cream' } = {}) => { const sc = document.createElement('canvas'); sc.width = W * times.length; sc.height = H * rows.length; const g = sc.getContext('2d');
  rows.forEach(([name, spec], r) => times.forEach((t, c) => { const tl = window.tile(spec, t, { W, H, bg: spec.bg || bg }); g.drawImage(tl, c * W, r * H); g.font = '12px monospace'; label(g, c * W, r * H, `${name} t=${t.toFixed(2)}`); })); return sc.toDataURL('image/png'); };
const WORDS = 'So this is the thing nobody tells you about voice AI. It is fast, it is free, and it never sleeps!'.split(' ').map((x, i) => ({ w: x, s: 0.2 + i * 0.3, e: 0.2 + i * 0.3 + 0.26, emph: /^(fast,|free,|sleeps!|nobody)$/.test(x) }));
window.WORDS = WORDS;
window.capSheet = (styles, times, { W = 540, H = 960, platform = 'conservative', overlay = true, bg = 'photo' } = {}) => { const chunks = chunkWords(WORDS), sc = document.createElement('canvas'); sc.width = W * times.length; sc.height = H * styles.length; const g = sc.getContext('2d');
  styles.forEach((sn, r) => times.forEach((t, c) => { const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920; const cg = cv.getContext('2d'); plate(cg, 1080, 1920, bg);
    const fg = cg.createRadialGradient(540, 700, 40, 540, 700, 420); fg.addColorStop(0, '#f1c9a8'); fg.addColorStop(1, '#a8714f'); cg.fillStyle = fg; cg.beginPath(); cg.ellipse(540, 760, 300, 380, 0, 0, 7); cg.fill();
    if (overlay) { const z = safeRect(platform, 1080, 1920); cg.strokeStyle = 'rgba(255,60,60,.8)'; cg.lineWidth = 3; cg.setLineDash([14, 10]); cg.strokeRect(z.x0, z.y0, z.w, z.h); cg.setLineDash([]); }
    drawCaptions(cg, chunks, t, CAPTION_STYLES[sn], { W: 1080, H: 1920, platform }); g.drawImage(cv, c * W, r * H, W, H); g.font = '13px monospace'; label(g, c * W, r * H, `${sn} t=${t.toFixed(2)}`); })); return sc.toDataURL('image/png'); };
window.captionRects = (platform, styleName, times) => { const chunks = chunkWords(WORDS), cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1920; const g = cv.getContext('2d'); const out = []; for (const t of times) { const r = drawCaptions(g, chunks, t, CAPTION_STYLES[styleName], { W: 1080, H: 1920, platform }); if (r) out.push(r.rect); } return out; };
window.iconSheet = () => { const ids = Object.keys(ICONS), cv = document.createElement('canvas'); cv.width = 130 * 8; cv.height = 150 * Math.ceil(ids.length / 8); const g = cv.getContext('2d'); g.fillStyle = '#20243a'; g.fillRect(0, 0, cv.width, cv.height); ids.forEach((id, i) => { drawIcon(g, id, (i % 8) * 130 + 65, Math.floor(i / 8) * 150 + 62, 90, { color: '#FFD400', progress: 1, t: 0.3, seed: i }); g.fillStyle = '#fff'; g.font = '12px monospace'; g.fillText(id, (i % 8) * 130 + 8, Math.floor(i / 8) * 150 + 140); }); return cv.toDataURL('image/png'); };
window.CONFIG = { name: 'type-demo', fps: 30, loopFrames: 60, width: 1280, height: 720 }; window.__gpu = 'n/a (2D canvas)'; window.__ready = true;
</script></body></html>
