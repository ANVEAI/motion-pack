<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>motion-pack demo: round-6 type parts</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-Variable.ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
html, body { margin: 0; background: #F3F1EC; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3F1EC; font-family: "Manrope", sans-serif; color: #111; }
.clip { position: absolute; inset: 0; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene { overflow: hidden; } .part { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="36">
<section class="clip scene" id="s-verbs" data-start="0.0000" data-duration="5.0000" data-track-index="1" style="background:#07060B"><div class="part" id="p-verbs"></div></section>
<section class="clip scene" id="s-hover" data-start="5.0000" data-duration="5.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-hover"></div></section>
<section class="clip scene" id="s-dock" data-start="10.5000" data-duration="5.5000" data-track-index="1" style="background:#0E0E14"><div class="part" id="p-dock"></div></section>
<section class="clip scene" id="s-connect" data-start="16.0000" data-duration="7.0000" data-track-index="1" style="background:#0E0E14"><div class="part" id="p-connect"></div></section>
<section class="clip scene" id="s-degrade" data-start="23.0000" data-duration="9.0000" data-track-index="1" style="background:#07060B"><div class="part" id="p-degrade"></div></section>
<section class="clip scene" id="s-end" data-start="32.0000" data-duration="4.0000" data-track-index="1" style="background:#0E0E14"><div class="part" id="p-end"></div></section>
<div id="fx" class="clip" data-start="0" data-duration="36" data-track-index="5"></div>
<audio id="mix" src="assets/media/mix.wav" data-start="0" data-duration="36" data-track-index="9" data-volume="1"></audio>
</div>
<script type="module" src="assets/mp/adapters/type.mjs"></script>
<script type="module" src="assets/mp/adapters/transitions.mjs"></script>
<script type="module">
import { MP } from './assets/mp/pack.mjs';
import { mountGfx } from './assets/mp/type/gfx/index.js';
import { mountStack, bindHF } from './assets/mp/layers/overlay.js';
bindHF(mountStack(document.getElementById('fx'), [{"kind":"grain","params":{"stock":"digital-soft"}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { fps: 30 });
const hf = (stack) => { const r = (t) => stack.render(t); window.addEventListener('hf-seek', (e) => r(e.detail.time)); r(window.__hfThreeTime || 0); };
const tl = gsap.timeline({ paused: true });
hf(mountGfx(document.getElementById('p-verbs'), [{"id":"title.verbCard","at":0,"dur":5,"params":{"words":[{"big":"Plan","rest":"the whole week"},{"big":"Ship","rest":"it before lunch"}],"chapterDur":2.4}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-hover'), [{"id":"chart.hoverTooltip","at":5,"dur":5.5,"params":{"scale":1.5,"chart":{"label":"Illustrative weekly series","text":"#0E0E14"}}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-dock'), [{"id":"ui.dockLaunch","at":10.5,"dur":5.5,"params":{"scale":1.5}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-connect'), [{"id":"ui.connectRows","at":16,"dur":7,"params":{"scale":1.5}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-degrade'), [{"id":"layout.degradingDiagram","at":23,"dur":9,"params":{"beats":[{"at":0,"caption":"Everything looks fine","layout":"trio","mood":"calm","links":"line"},{"at":1.5,"caption":"Steps start to repeat","layout":"trio","mood":"worried","links":"loop"},{"at":3,"caption":"Cracks begin to spread","layout":"trio","mood":"cracked","links":"loop"},{"at":4.5,"caption":"Then it breaks","layout":"trio","mood":"broken","links":"broken"},{"at":6.4,"caption":"One tidy layout","layout":"row4","mood":"tidy","links":"line"},{"at":7.9,"caption":"Every part checked","layout":"row4","mood":"tidy","links":"line","marks":[1,1,-1,1]}]}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-end'), [{"id":"type.commandPill","at":32,"dur":4,"params":{"text":"ship --first-draft","size":84,"dur":4}}], { W: 1920, H: 1080 }));
tl.set({}, {}, 36.0000);
window.__timelines['main'] = tl;
/* canvas text measures and draws with the fallback font until a face is in (measure() reads canvas metrics, the embedding chip and the epicycle readout draw text):
   load the faces up front and repaint the current frame once they land, so frame t is the same on every seek order */
let last = window.__hfThreeTime || 0; window.addEventListener('hf-seek', (e) => { last = e.detail.time; });
Promise.all([...['600', '700', '800'].map((w) => document.fonts.load(w + ' 30px Manrope')), document.fonts.load('600 24px "IBM Plex Mono"')]).then(() => window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: last } })));
</script>
</body>
</html>
