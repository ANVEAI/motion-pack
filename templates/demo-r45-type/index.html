<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>motion-pack demo: round-4/5 type + layers parts</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-Variable.ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
html, body { margin: 0; background: #F3F1EC; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3F1EC; font-family: "Manrope", sans-serif; color: #111; }
.clip { position: absolute; inset: 0; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene { overflow: hidden; } .part { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="20">
<section class="clip scene" id="s-cloud" data-start="0.0000" data-duration="2.0000" data-track-index="1" style="background:#0B1210"><div class="part" id="p-cloud"></div></section>
<section class="clip scene" id="s-path" data-start="2.0000" data-duration="1.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-path"></div></section>
<section class="clip scene" id="s-many" data-start="3.5000" data-duration="2.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-many"></div></section>
<section class="clip scene" id="s-bundle" data-start="5.5000" data-duration="3.0000" data-track-index="1" style="background:#FFFFFF"><div class="part" id="p-bundle"></div></section>
<section class="clip scene" id="s-flank" data-start="8.5000" data-duration="1.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-flank"></div></section>
<section class="clip scene" id="s-ascii" data-start="9.5000" data-duration="2.0000" data-track-index="1" style="background:#17120F"><div class="part" id="p-ascii"></div></section>
<section class="clip scene" id="s-draw" data-start="11.5000" data-duration="2.5000" data-track-index="1" style="background:#07121C"><div class="part" id="p-draw"></div></section>
<section class="clip scene" id="s-hex" data-start="14.0000" data-duration="1.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-hex"></div></section>
<section class="clip scene" id="s-chapters" data-start="15.0000" data-duration="2.0000" data-track-index="1" style="background:#0E0E14"><div class="part" id="p-chapters"></div></section>
<section class="clip scene" id="s-end" data-start="17.0000" data-duration="3.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-end"></div></section>
<div id="fx" class="clip" data-start="0" data-duration="20" data-track-index="5"></div>
<audio id="mix" src="assets/media/mix.wav" data-start="0" data-duration="20" data-track-index="9" data-volume="1"></audio>
</div>
<script type="module" src="assets/mp/adapters/type.mjs"></script>
<script type="module" src="assets/mp/adapters/transitions.mjs"></script>
<script type="module">
import { MP } from './assets/mp/pack.mjs';
import { mountGfx } from './assets/mp/type/gfx/index.js';
import { mountStack, bindHF } from './assets/mp/layers/overlay.js';
bindHF(mountStack(document.getElementById('fx'), [{"kind":"grain","params":{"stock":"digital-soft"}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { fps: 30 });
const hf = (stack) => { const r = (t) => stack.render(t); window.addEventListener('hf-seek', (e) => r(e.detail.time)); r(window.__hfThreeTime || 0); };
const tl = gsap.timeline({ paused: true });
bindHF(mountStack(document.getElementById('p-cloud'), [{"kind":"embeddingCloud","params":{"query":"photos from the trip","queryAt":0.2,"queryDur":0.45,"liftDur":0.4,"collapseAt":0.95,"collapse":0.4,"spin":0.06,"radius":0.68,"dot":3.4,"thumbSize":40}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { t0: 0.0000, fps: 30 });
hf(mountGfx(document.getElementById('p-path'), [{"id":"type.textOnPath","at":2,"dur":1.5,"params":{"text":"search everything you saved","path":"swoop","delay":0.05,"travel":1.05,"size":70}}], { W: 1920, H: 1080 }));
bindHF(mountStack(document.getElementById('p-many'), [{"kind":"convergeToDot","params":{"nodes":36,"field":0.4,"at":0.5,"dur":0.7,"stagger":0.3}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { t0: 3.5000, fps: 30 });
hf(mountGfx(document.getElementById('p-bundle'), [{"id":"layout.iconMergeLockup","at":5.5,"dur":3,"params":{"name":"The Bundle","tile":230,"drawAt":0,"draw":0.45,"stagger":0.12,"hits":[0.75,0.95,1.15,1.35],"lineAt":1.55,"line":0.4,"mergeAt":1.95,"merge":0.55,"nameSize":110,"rowScale":0.7}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-flank'), [{"id":"type.flankWords","at":8.5,"dur":1,"params":{"words":["Made for","long days"],"split":1,"subject":{"box":[0.43,0.2,0.14,0.6],"arriveAt":0,"arrive":0.35},"size":110,"margin":54,"drawSubject":true,"stagger":0.04}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-ascii'), [{"id":"type.asciiMosaic","at":9.5,"dur":2,"params":{"scatterAt":0.1,"scatter":0.4,"settleAt":0.35,"settle":0.7,"spread":0.4}}], { W: 1920, H: 1080 }));
bindHF(mountStack(document.getElementById('p-draw'), [{"kind":"epicycleDraw","params":{"steps":[[0,4],[0.8,16],[1.6,"full"]],"period":0.8,"width":3.4,"glow":14,"source":"computed from the path drawn here"}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { t0: 11.5000, fps: 30 });
bindHF(mountStack(document.getElementById('p-hex'), [{"kind":"hexMosaic","params":{"waves":[{"at":0.05,"from":[0,0.5],"speed":3200}],"flip":0.25,"panel":{"rect":[0.3,0.28,0.4,0.44]}}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { t0: 14.0000, fps: 30 });
hf(mountGfx(document.getElementById('p-chapters'), [{"id":"type.behindSubject","at":15,"dur":2,"params":{"steps":[[0,"STILL"],[0.6,"CLIP"],[1.2,"SONG"]],"size":420,"swap":0.14}},{"id":"type.electricOutline","at":15.1,"dur":0.35,"params":{"text":"1","draw":0.3,"size":360}},{"id":"type.electricOutline","at":15.75,"dur":0.35,"params":{"text":"2","draw":0.3,"size":360}},{"id":"type.electricOutline","at":16.4,"dur":0.35,"params":{"text":"3","draw":0.3,"size":360}}], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-end'), [{"id":"title.partnerLockup","at":17,"dur":3,"params":{"labels":["Brand A","Brand B"]}}], { W: 1920, H: 1080 }));
tl.set({}, {}, 20.0000);
window.__timelines['main'] = tl;
/* canvas text measures and draws with the fallback font until a face is in (measure() reads canvas metrics, the embedding chip and the epicycle readout draw text):
   load the faces up front and repaint the current frame once they land, so frame t is the same on every seek order */
let last = window.__hfThreeTime || 0; window.addEventListener('hf-seek', (e) => { last = e.detail.time; });
Promise.all([...['600', '700', '800'].map((w) => document.fonts.load(w + ' 30px Manrope')), document.fonts.load('600 24px "IBM Plex Mono"')]).then(() => window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: last } })));
</script>
</body>
</html>
