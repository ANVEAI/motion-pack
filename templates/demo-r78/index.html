<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=960, height=540" />
<title>motion-pack demo: xp-r78 parts</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-Variable.ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
html, body { margin: 0; background: #0A0B10; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A0B10; font-family: "Manrope", sans-serif; color: #111; }
.clip { position: absolute; inset: 0; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#plate, #gfx { position: absolute; inset: 0; } #plate { background-size: 200% 200%; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="960" data-height="540" data-duration="11">
<div id="plate" class="clip" data-start="0" data-duration="11" data-track-index="1"></div>
<div id="gfx" class="clip" data-start="0" data-duration="11" data-track-index="2"></div>
</div>
<script type="module">
import { mountGfx, bindHF } from './assets/mp/type/gfx/index.js';
const D = {"W":960,"H":540,"T":11,"items":[{"id":"type.sentenceAcrossShots","at":0,"dur":3.2},{"id":"ui.glassPanel","at":3.2,"dur":3.8,"params":{"box":[0.08,0.2,0.4,0.6],"blurIn":[0.2,1],"label":"Frosted glass","skeleton":3}},{"id":"ui.rimLight","at":3.4,"dur":3.6,"params":{"box":[0.56,0.24,0.36,0.52],"sweep":[0.3,1.9,1]}},{"id":"ui.approvalSlider","at":7.2,"dur":3.8,"params":{"box":[0.3,0.1,0.4,0.74],"slideAt":0.8}}]}, plate = document.getElementById('plate');
const SHOTS = ['linear-gradient(135deg,#ff8a3d,#ff3d7a)', 'linear-gradient(135deg,#2bd9a0,#1a6cff)', 'linear-gradient(135deg,#ffd23a,#ff6a1a)', 'linear-gradient(135deg,#8e6bff,#3a1fb0)'], CUTS = [0, 0.6, 1.2, 1.8];
const STRIPES = 'repeating-linear-gradient(115deg,#ff5f6d 0 60px,#ffc371 60px 120px,#2b86c5 120px 190px,#1a1a2e 190px 260px)';
const paint = (t) => { if (t < 3.2) { let i = 0; CUTS.forEach((c, k) => { if (t >= c - 1e-9) i = k; }); plate.style.background = SHOTS[i]; }
  else if (t < 7.2) { plate.style.background = STRIPES; plate.style.backgroundPosition = ((t - 3.2) * 90) + 'px 0'; plate.style.backgroundSize = 'auto'; }
  else { plate.style.background = '#0A0B10'; } };
window.addEventListener('hf-seek', (e) => paint(e.detail.time)); paint(window.__hfThreeTime || 0);
const { W, H, T } = D, tl = gsap.timeline({ paused: true });
bindHF(mountGfx(document.getElementById('gfx'), D.items, { W, H }));
tl.set({}, {}, T); window.__timelines = window.__timelines || {}; window.__timelines['main'] = tl;
let last = window.__hfThreeTime || 0; window.addEventListener('hf-seek', (e) => { last = e.detail.time; });
Promise.all([...['500', '700', '800'].map((w) => document.fonts.load(w + ' 30px Manrope'))]).then(() => window.dispatchEvent(new CustomEvent('hf-seek', { detail: { time: last } })));
</script>
</body></html>
