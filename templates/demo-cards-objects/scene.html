<meta charset="utf-8">
<title>motion-pack demo-cards-objects: 3D plate</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;padding:0;background:#dfe6f2;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
/* demo-cards-objects, shot 4 (3 s plate): objects/glass-dome floating on a pale cyc, a clay worker (objects/worker + spec.clay) typing inside,
   objects/icon-orbit popping on around it, and a blank floating panel on the right whose four front corners are exported per frame
   (window.__pinQuad(t) -> [[x,y] x4] px, TL TR BR BL) so the HyperFrames composition can corner-pin a DOM UI card onto it (layout.cornerPin).
   Camera: one slow push (cam3d-style ease). Seek-safe: everything is a function of t. ?notype=1 is implied (no canvas type). */
import { runScene, U, THREE } from './objects/kit/studio-lite.js';
import { O } from './objects/index.js';
import { stageConfig, makeStage, shot } from './objects/stage.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const { E, seg } = U, SEC = 3;
window.CONFIG = stageConfig({ name: 'demo-cards-objects-dome', seconds: SEC, qaFrames: [0, 45, 89], colors: { backdrop: '#dfe6f2' }, grade: { vignette: 0.05, dofK: 18 } });
const st = {}, PANEL = { w: 1.5, h: 0.95, d: 0.05 };
const SHOT = { fov: 20, elev: [9, 8], az: [-14, -7], dist: [12.8, 11.3], target: [1.3, 1.25, 0], screen: [960, 560], t0: 0, t1: SEC };

runScene({
  async build(ctx) {
    st.stage = makeStage(ctx, { mode: 'white', paper: '#dfe6f2', cycFar: -12, cycR: 8 }); const G = st.stage.parent;
    st.dome = O.makeGlassDome(ctx, G, { r: 1.05, base: 1.35, y: 0.95 });
    const inner = new THREE.Group(); inner.scale.setScalar(0.62); st.dome.inside.add(inner);
    const desk = ctx.add(inner, new THREE.Mesh(new RoundedBoxGeometry(1.15, 0.42, 0.6, 4, 0.05), O.MAT.satin('#d8cfc4', { roughness: 0.55 })), { cast: true, recv: true }); desk.position.set(0.05, 0.21, 0.2);
    st.laptop = O.makeLaptop(ctx, inner, { scale: 0.5 }); st.laptop.pose([0.25, 0.42, 0.25], Math.PI + 0.35);
    const type = (t, i) => [t, { ...O.look(0.35, 0.05, 0.3), lean: 0.12, aLu: 1.05 + (i % 2 ? 0.14 : 0), aRu: 1.05 + (i % 2 ? 0 : 0.14), aLo: 0.12, aRo: 0.12, aLe: 0.95, aRe: 0.95, squint: 0.3 }, 'soft'];
    const keys = Array.from({ length: 16 }, (_, i) => type(i * 0.13, i)); keys.push([2.15, O.emote({ ...O.look(-0.2, -0.25, -0.05), lean: 0.02 }, 'happy'), 'soft']);
    st.worker = O.makeWorker(ctx, inner, { color: '#f2c3a0', clay: { rim: '#ff9a6b', sss: 0.45 }, keys: O.keysOf(keys), path: [{ t: 0, at: [-0.2, -0.3] }], blinks: [0.9, 2.6] }, () => 0, st.stage.lights.rim);
    st.orbit = O.makeIconOrbit(ctx, G, { n: 8, radius: 1.8, y: 1.35, appearAt: 0.15, stagger: 0.08 });
    // the pin target: a blank satin panel floating right of the dome (its face is replaced in the composition by a corner-pinned DOM card)
    st.panel = new THREE.Group(); G.add(st.panel); st.panel.position.set(3.25, 1.6, -0.9); st.panel.rotation.set(0.04, -0.42, 0.02);
    ctx.add(st.panel, new THREE.Mesh(new RoundedBoxGeometry(PANEL.w, PANEL.h, PANEL.d, 4, 0.04), O.MAT.satin('#fbfaf7', { roughness: 0.35 })), { cast: true, recv: true, name: 'pin-panel' });
    ctx.probes = { dome: st.dome.probes.dome, worker: st.worker.probes.worker, panel: st.panel };
  },
  update(ctx, t, n, slot) {
    st.stage.update(n, slot, 0); st.dome.update(t); st.orbit.update(t); st.worker.update(t);
    st.laptop.set({ open: 1, screen: 1, ui: { progress: +(0.3 + 0.6 * seg(t, 0, SEC)).toFixed(2), title: 'Ideas' } });
    st.panel.position.y = 1.55 + 0.03 * Math.sin(2 * Math.PI * 0.3 * t + 0.8);
  },
  camera(ctx, t) { return shot(ctx, t, SHOT); },
  focus() { return [0.6, 1.1, 0]; },
  subframes() { return 4; },
});
/* the panel's front face corners in output pixels at t (TL, TR, BR, BL), for layout.cornerPin keys */
window.__pinQuad = (t) => { window.__layout(t); const h = PANEL.h / 2 - 0.02, w = PANEL.w / 2 - 0.02, z = PANEL.d / 2 + 0.001;
  return [[-w, h], [w, h], [w, -h], [-w, -h]].map(([x, y]) => { const v = new THREE.Vector3(x, y, z).applyMatrix4(st.panel.matrixWorld); return window.__project(v.x, v.y, v.z).map((q) => +q.toFixed(2)); }); };
</script>
</body>
