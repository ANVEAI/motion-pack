<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>motion-pack demo: type + layout parts</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-Variable.ttf") format("truetype"); font-weight: 200 800; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
html, body { margin: 0; background: #F3F1EC; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3F1EC; font-family: "Manrope", sans-serif; color: #111; }
.clip { position: absolute; inset: 0; }
.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scene { overflow: hidden; } .part { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="17.5">
<section class="clip scene" id="s-collage" data-start="0.0000" data-duration="3.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-collage"></div></section>
<section class="clip scene" id="s-wheel" data-start="3.0000" data-duration="2.0000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-wheel"></div></section>
<section class="clip scene" id="s-inline" data-start="5.0000" data-duration="2.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-inline"></div></section>
<section class="clip scene" id="s-mosaic" data-start="7.5000" data-duration="1.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-mosaic"></div></section>
<section class="clip scene" id="s-orbit" data-start="9.0000" data-duration="2.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-orbit"></div></section>
<section class="clip scene" id="s-marquee" data-start="11.5000" data-duration="1.5000" data-track-index="1" style="background:#0E0E14"><div class="part" id="p-marquee"></div></section>
<section class="clip scene" id="s-connect" data-start="13.0000" data-duration="1.5000" data-track-index="1" style="background:#F3F1EC"><div class="part" id="p-connect"></div></section>
<section class="clip scene" id="s-end" data-start="14.5000" data-duration="3.0000" data-track-index="1" style="background:#4A18ED"><div class="part" id="p-end"></div></section>
<div id="fx" class="clip" data-start="0" data-duration="17.5" data-track-index="5"></div>
<audio id="mix" src="assets/media/mix.wav" data-start="0" data-duration="17.5" data-track-index="9" data-volume="1"></audio>
</div>
<script type="module" src="assets/mp/adapters/type.mjs"></script>
<script type="module" src="assets/mp/adapters/transitions.mjs"></script>
<script type="module">
import { MP } from './assets/mp/pack.mjs';
import { mountGfx } from './assets/mp/type/gfx/index.js';
import { mountStack, bindHF } from './assets/mp/layers/overlay.js';
bindHF(mountStack(document.getElementById('fx'), [{"kind":"grain","params":{"stock":"digital-soft"}}], { width: 1920, height: 1080, fps: 30, seed: 3 }), { fps: 30 });
const hf = (stack) => { const r = (t) => stack.render(t); window.addEventListener('hf-seek', (e) => r(e.detail.time)); r(window.__hfThreeTime || 0); };
const tl = gsap.timeline({ paused: true });
hf(mountGfx(document.getElementById('p-collage'), [{ id: 'layout.scatterCollage', at: 0.0000, dur: 3.0000, params: {"text":"Your team dreams big","size":70,"explodeAt":0.9} }], { W: 1920, H: 1080 }));
MP.type(tl, 'type/wordWheel', '#p-wheel', { at: 3.0000, dur: 2.0000, fps: 30, W: 1920, H: 1080, params: {"words":["Plans","Docs","Sites","Build it all.","Design","Data","Automations"],"steps":[[0,0],[0.3,1],[0.6,2],[0.9,3]],"move":0.26,"size":92} });
MP.type(tl, 'type/inlineMedia', '#p-inline', { at: 5.0000, dur: 2.5000, fps: 30, W: 1920, H: 1080, params: {"text":"Every [stack] idea, in [photo] *one* place","size":80} });
hf(mountGfx(document.getElementById('p-mosaic'), [{ id: 'layout.mosaicBurst', at: 7.5000, dur: 1.5000, params: {"fly":0.7,"spread":0.45} }], { W: 1920, H: 1080 }));
hf(mountGfx(document.getElementById('p-orbit'), [{ id: 'layout.orbitRing', at: 9.0000, dur: 2.5000, params: {"text":"Every task, connected.","size":58,"iconStart":0.35} }], { W: 1920, H: 1080 }));
MP.type(tl, 'type/marquee', '#p-marquee', { at: 11.5000, dur: 1.5000, fps: 30, W: 1920, H: 1080, params: {"text":"all in one place ·","accent":"one","accentStyle":"pixel","size":0.4,"speed":0.55} });
hf(mountGfx(document.getElementById('p-connect'), [{ id: 'callout.connectorLabel', at: 13.0000, dur: 1.5000, params: {"items":[{"label":"From the first idea","at":[0.3,0.36],"tint":"#FFD8C2","ink":"#3A1E10"},{"label":"to the final launch","at":[0.5,0.6],"tint":"#D9D2FF","ink":"#1C1050"}],"origin":[0.2,0.14],"step":0.55,"draw":0.38,"size":46} }], { W: 1920, H: 1080 }));
MP.type(tl, 'type/glyphMorphCursor', '#p-end', { at: 14.5000, dur: 3.0000, fps: 30, W: 1920, H: 1080, params: {"text":"Build it all","size":92,"charRate":0.06666666666666667,"blink":0.25,"shapes":["circle","square"],"morph":0.18,"hold":0.08,"color":"#FFFFFF","accent":"#FFFFFF","glyph":1.1} });
tl.set({}, {}, 17.5000);
window.__timelines['main'] = tl;
</script>
</body>
</html>
