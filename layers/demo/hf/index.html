<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280, height=720"><title>motion-pack HyperFrames demo</title>
<script src="gsap.min.js"></script>
<style>
@font-face{font-family:Manrope;src:url(Manrope-Variable.ttf);font-weight:200 800}
body{margin:0;background:#000}#root{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
#world{position:absolute;inset:0;background:linear-gradient(#f4efe6,#d9c9b6);filter:url(#mp-grade)}
.card{position:absolute;left:120px;top:140px;width:520px;height:330px;border-radius:26px;background:#f7f5ef}
.face{position:absolute;left:760px;top:130px;width:300px;height:380px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 40% 35%,#f1c9a8,#c98c62)}
#type{position:absolute;left:150px;top:170px;width:480px;color:#111}#overlays,#overlaysLow{position:absolute;inset:0;pointer-events:none}#caps{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="720" data-duration="3">
  <div id="world"><div class="card"></div><div class="face"></div></div>
  <div id="overlaysLow"></div><div id="type"></div><div id="overlays"></div><div id="caps"></div>
</div>
<script type="module">
import { toSVGFilter } from './mp/layers/grade.js'; import { GRADES } from './mp/layers/presets/grades.js'; import { mountStack, bindHF } from './mp/layers/overlay.js';
import { mountType, bakeType, mountCaptions, bakeCaptions } from './mp/type/dom.js'; import { chunkWords, CAPTION_STYLES } from './mp/type/captions.js';
import { push2d, handheld2d} from './mp/camera/cam2d.js'; import { bakeGSAP } from './mp/camera/bake.js';
await document.fonts.load('800 60px Manrope');
document.getElementById('defs').innerHTML = toSVGFilter(GRADES['warm-film'], 'mp-grade');
const tl = gsap.timeline({ paused: true });
const cam = handheld2d(push2d({ x: 0, y: 0, scale: 1, rot: 0, blur: 0, blurAngle: 0, origin: [0.5, 0.5] }, { at: 0, dur: 1.4, to: 1.12 }), { level: 'subtle', seed: 2 });
bakeGSAP(tl, '#world', cam, { t0: 0, dur: 3, fps: 30, W: 1280, H: 720, cover: true });
const spec = { preset: 'maskRise', text: 'Voice that sells', at: 0.2, out: 2.6 }; const m = mountType(document.getElementById('type'), spec, { fontPx: 84 * 720 / 1080 * 1.0, H: 720 }); bakeType(tl, m, spec, { t0: 0, dur: 3, fps: 30 });
const words = 'It is fast, it is free, and it never sleeps'.split(' ').map((w, i) => ({ w, s: 0.4 + i * 0.28, e: 0.4 + i * 0.28 + 0.25 })), chunks = chunkWords(words);
const cm = mountCaptions(document.getElementById('caps'), chunks, CAPTION_STYLES.karaoke, { W: 1280, H: 720, platform: 'wideTitle' }); bakeCaptions(tl, cm, chunks, { t0: 0, dur: 3, fps: 30 });
/* stack rule: light leaks live BELOW the story type; vignette, dust, grain above it */
const low = mountStack(document.getElementById('overlaysLow'), [{ kind: 'leaks', params: { intensity: 0.28, loop: true, edge: 'left' } }], { width: 1280, height: 720, fps: 30 }); bindHF(low, { fps: 30 });
const stack = mountStack(document.getElementById('overlays'), [{ kind: 'vignette', params: { amount: 0.22 } }, { kind: 'dust', params: { density: 0.5, under: 0.6 } }, { kind: 'grain', params: { stock: 'film35' } }], { width: 1280, height: 720, fps: 30 });
bindHF(stack, { fps: 30 });
window.__timelines = window.__timelines || {}; window.__timelines['main'] = tl;
</script></body></html>
