<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion-pack objects gallery</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;padding:0;background:#f5f2ea;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
/* objects gallery: one page, four shots (?shot=devices | film | cast | dome), 4 s each, deterministic (renderAt(t) depends on t alone).
   devices: the NEW laptop, phone and mug on the slab with the worker (wave act): lid opens, screens power on, the mug sloshes.
   film:    the extracted set pieces: product box, liquid-chrome cloud, paper stack + curling sheet, meter, readout, app windows, tiles,
            stand card + puck, plug.
   cast:    the worker's 6 emotions side by side (neutral, happy, sad, surprised, angry, scheming).
   dome:    glass-dome platform (floating) with a clay worker typing inside, the icon orbit popping on around it (2026-10-14).
   r3:      objects/logo-extrude in the four presets (chrome, glass, iridescent, satin; the satin one sliced and offset) spinning on a pale cyc, and the
            flat objects/mascot2d on a plane in the scene (cheer hop then point) (2026-10-14, round 3). */
import { runScene, U } from './kit/studio-lite.js';
import { O } from './index.js';
import { stageConfig, makeStage, shot } from './stage.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const { E, seg, clamp, lerp, springU } = U;
const q = new URLSearchParams(location.search), SHOT = q.get('shot') || 'devices';
window.CONFIG = stageConfig({ name: 'objects-gallery-' + SHOT, seconds: 4, qaFrames: [0, 60, 119], ...(SHOT === 'dome' ? { colors: { backdrop: '#dfe6f2' }, grade: { vignette: 0.05, dofK: 22 } } : SHOT === 'r3' ? { colors: { backdrop: '#e6e1f2' }, grade: { vignette: 0.06, dofK: 14, bloom: 0.5 } } : {}) });
const st = {};
const SHOTS = {
  devices: { fov: 18, elev: [21, 18], az: [-15, -8], dist: [10.6, 10.0], target: [-0.05, 0.42, 0.0], screen: [960, 560], tall: { dist: [19, 18], screen: [540, 1100] } },
  film: { fov: 18, elev: [24, 22], az: [-14, -6], dist: [19.0, 18.2], target: [0, 0.55, -0.1], screen: [960, 560], tall: { dist: [40, 38.5], screen: [540, 1100] } },
  cast: { fov: 18, elev: [9, 8], az: [-4, 4], dist: [13.6, 13.2], target: [0, 0.5, 0], screen: [960, 600], tall: { dist: [34, 33], screen: [540, 1150] } },
  r3: { fov: 22, elev: [8, 7], az: [-6, 4], dist: [10.2, 9.6], target: [0, 1.15, 0], screen: [960, 540], tall: { dist: [26, 25], screen: [540, 1000] } },
  dome: { fov: 20, elev: [10, 8], az: [-10, 6], dist: [10.5, 9.4], target: [0, 1.15, 0], screen: [960, 560], tall: { dist: [30, 28], screen: [540, 1000] } },
};

runScene({
  async build(ctx) {
    const slab = SHOT === 'film' ? [6.4, 0.64, 3.0] : SHOT === 'cast' ? [6.0, 0.64, 1.6] : [3.6, 0.64, 2.1];
    st.stage = makeStage(ctx, SHOT === 'dome' ? { mode: 'white', paper: '#dfe6f2', cycFar: -12, cycR: 8 } : SHOT === 'r3' ? { mode: 'white', paper: '#e6e1f2', cycFar: -10, cycR: 7 } : { slab }); const G = st.stage.parent;
    if (SHOT === 'devices') {
      st.laptop = O.makeLaptop(ctx, G, {}); st.laptop.pose([-0.35, 0, -0.25], 0.18);
      st.phone = O.makePhone(ctx, G, {}); st.phone.pose([0.95, 0.016 + 0.0, 0.55], [-Math.PI / 2, -0.35, 0]);
      st.mug = O.makeMug(ctx, G, {}); st.mug.pose([1.05, 0, -0.35], -0.6);
      const k = O.keysOf([[0, O.POSES.front]], O.ACTS.wave(1.6), [[3.2, O.emote('front', 'happy')]]);
      st.worker = O.makeWorker(ctx, G, { keys: k, path: [{ t: 0, at: [-1.45, 0.45] }], blinks: [0.9, 3.4] }, () => 0, st.stage.lights.rim);
      ctx.probes = { laptop: st.laptop.probes.laptop, phone: st.phone.probes.phone, mug: st.mug.probes.mug, worker: st.worker.probes.worker };
    } else if (SHOT === 'film') {
      st.box = O.makeAnveBox(ctx, { w: 1.36, h: 1.0, d: 1.08, r: 0.05, lidH: 0.09, seam: 0.008, bandH: 0.066, baseH: 0.22, led: 0.018, ledX: 0.44, body: '#111113', lid: '#1b1b1e', base: '#17171a', rough: 0.46, clearcoat: 0.35, ccRough: 0.22, band: '#ffa64d' });
      G.add(st.box.group); st.box.pose([0.2, 0, -0.35]);
      st.blob = O.makeChromeBlob(ctx, { res: 72, box: 3.0, rough: 0.08, f0: 0.92 }, st.stage.env);
      O.makePaperBlock(ctx, G, { w: 0.64, h: 0.06, d: 0.86, pos: [-2.55, 0, 0.45], yaw: 0.08 });
      st.sheet = O.makeSheet(ctx, G, { w: 0.64, h: 0.86 }, O.sheetTexture({ w: 0.64, h: 0.86, corner: 0.05, red: '#e5483a' }));
      st.meter = O.makeMeter(ctx, G, { pos: [-1.35, 0.98 * 0.62, -0.95], R: 0.62, label: 'MONTHLY COST', vmax: 100, red: 75, majorEvery: 20, minorEvery: 5, v0: 20 });
      st.readout = O.makeReadout(ctx, G, { pos: [-1.6, -0.32, 1.501], win: [0.36, 0.52], gap: 0.06, labelSize: [0.9, 0.52], pad: 0.07, digitFont: 0.88, label: ['FILES', 'SENT OUT'] });
      st.wins = [['Notes AI', -1.2], ['Docs AI', -0.35]].map(([name, x], i) => { const w = O.makeWindow(ctx, G, { name, w: 0.8, h: 0.55 }); w.set([x + 2.6, 0, -1.1 + 0.1 * i], { lean: 6, yaw: -8 + 10 * i }); return w; });
      st.tiles = ['mic', 'page', 'deck'].map((ic, i) => { const t = O.makeTile(ctx, G, { icon: ic }); t.set([1.55 + 0.36 * i, 0, 0.95]); return t; });
      st.card = O.makeStandCard(ctx, G, { name: 'Clinics', icon: 'cross', w: 0.64 }); st.card.set([-0.7, 0, 0.9], { lean: 12, yaw: 12 });
      st.puck = O.makePuck(ctx, st.card.group); st.puck.set([st.card.seat[0], st.card.seat[1], 0.04]);
      st.plug = O.makePlug(ctx, G, { label: 'API', icon: 'wave' }); st.plug.set([2.55, 0, 0.75], { led: 1 });
      ctx.probes = { box: st.box.group, meter: st.meter.disc, readout: st.readout.group };
    } else if (SHOT === 'r3') {
      st.logos = ['chrome', 'glass', 'iridescent', 'satin'].map((preset, i) => { const l = O.makeLogoExtrude(ctx, G, { preset, size: 1.05, depth: 0.2, spin: 0.14, yaw: -0.5 + 0.35 * i, slice: preset === 'satin' ? { y: 0.06, offset: [0.22, 0.1, 0.18] } : null, color: preset === 'satin' ? '#4a18ed' : null });
        l.group.position.set(-2.55 + 1.45 * i + (i > 1 ? 0.5 : 0), 1.45, 0); return l; });
      st.mascot = O.makeMascotPlane(ctx, G, { height: 1.5, spec: { keys: [[0, 'idle'], [0.4, 'cheer'], [2.2, 'point']], hops: [0.6, 1.2], blinks: [0.3, 2.6], talk: [[2.4, 3.4]] } });
      st.mascot.mesh.position.set(0.12, 0.72, 0.6);
      ctx.probes = { logo0: st.logos[0].probes.logo, logo3: st.logos[3].probes.logo, mascot: st.mascot.mesh };
    } else if (SHOT === 'dome') {
      st.dome = O.makeGlassDome(ctx, G, { r: 1.05, base: 1.35, y: 0.95 });
      const inner = new ctx.THREE.Group(); inner.scale.setScalar(0.62); st.dome.inside.add(inner);
      const desk = ctx.add(inner, new ctx.THREE.Mesh(new RoundedBoxGeometry(1.15, 0.42, 0.6, 4, 0.05), O.MAT.satin('#d8cfc4', { roughness: 0.55 })), { cast: true, recv: true }); desk.position.set(0.05, 0.21, 0.2);
      st.laptop = O.makeLaptop(ctx, inner, { scale: 0.5 }); st.laptop.pose([0.25, 0.42, 0.25], Math.PI + 0.35);
      const type = (t, i) => [t, { ...O.look(0.35, 0.05, 0.3), lean: 0.12, aLu: 1.05 + (i % 2 ? 0.14 : 0), aRu: 1.05 + (i % 2 ? 0 : 0.14), aLo: 0.12, aRo: 0.12, aLe: 0.95, aRe: 0.95, squint: 0.3 }, 'soft'];
      st.worker = O.makeWorker(ctx, inner, { color: '#f2c3a0', clay: { rim: '#ff9a6b', sss: 0.45 }, keys: O.keysOf(Array.from({ length: 30 }, (_, i) => type(i * 0.13, i))), path: [{ t: 0, at: [-0.2, -0.3] }], blinks: [1.1, 3.0] }, () => 0, st.stage.lights.rim);
      st.orbit = O.makeIconOrbit(ctx, G, { n: 8, radius: 2.05, y: 1.35, appearAt: 0.4 });
      ctx.probes = { dome: st.dome.probes.dome, worker: st.worker.probes.worker, orbit: st.orbit.probes.orbit };
    } else {
      st.cast = ['neutral', 'happy', 'sad', 'surprised', 'angry', 'scheming'].map((em, i) => {
        const x = (i - 2.5) * 0.92, base = em === 'sad' ? O.POSES.deflate : em === 'scheming' ? O.POSES.armsCrossed : em === 'happy' ? O.POSES.delight : em === 'surprised' ? O.POSES.flinch : em === 'angry' ? O.POSES.front : O.POSES.front;
        const p = O.emote({ ...base, yaw: 0, hYaw: (base.hYaw || 0) * 0.3 }, em);
        return O.makeWorker(ctx, G, { color: '#8d84d4', keys: [[0, p], [4, { ...p, sy: (p.sy || 1) * 1.01 }]], path: [{ t: 0, at: [x, 0.1] }], blinks: [1.2 + 0.4 * i] }, () => 0, st.stage.lights.rim);
      });
      ctx.probes = { w0: st.cast[0].probes.worker, w5: st.cast[5].probes.worker };
    }
  },
  update(ctx, t, n, slot) {
    st.stage.update(n, slot, 0);
    if (SHOT === 'devices') {
      const open = t < 1.3 ? E.soft(seg(t, 0.3, 1.3)) : 1 + 0.05 * (1 - springU(t - 1.3, 0.35, 2.5)) - 0.05;   // lid settles with a small spring
      st.laptop.set({ open: lerp(0.06, 1, open), screen: E.soft(seg(t, 1.2, 1.6)), ui: { progress: +(0.2 + 0.8 * E.soft(seg(t, 1.5, 3.5))).toFixed(3), title: 'Today' } });
      st.phone.set({ screen: E.soft(seg(t, 2.0, 2.3)), ui: { messages: 1 + Math.min(3, Math.floor(seg(t, 2.2, 3.4) * 3.99)) } });
      st.mug.set({ fill: 0.9, slosh: O.mugSlosh(t - 1.0, 0.10) });
      st.worker.update(t);
    } else if (SHOT === 'film') {
      const c = [1.9, 1.35, -0.9], b = 0.03 * Math.sin(2 * Math.PI * 0.5 * t);
      st.blob.update(c, [{ c: [c[0], c[1] - 0.06, c[2]], r: 0.3, s: [1.7, 0.62, 1.0] }, { c: [c[0] - 0.3, c[1] + 0.06 + b, c[2]], r: 0.22 }, { c: [c[0], c[1] + 0.17 - b, c[2]], r: 0.29 }, { c: [c[0] + 0.31, c[1] + 0.05, c[2]], r: 0.2 + b }], 0.13);
      const u = E.soft(seg(t, 0.5, 2.5)); st.sheet.bend(-1.6 * u, 0.4 * u); st.sheet.set([-2.55, 0.065 + 0.35 * u, 0.45], [0, 0.08, 0]);
      const v = 20 + 60 * E.soft(seg(t, 0.4, 3.0)); st.meter.setValue(v); st.meter.setZone(clamp((v - 75) / 5));
      st.readout.set(Math.min(5, 5 * seg(t, 0.4, 3.0)), '#e5483a');
      st.box.setBand(E.soft(seg(t, 1.0, 1.4))); st.box.setLeds('#34d399', t > 1.4 ? 1 : 0);
      const fl = E.soft(seg(t, 2.0, 2.6)); st.puck.set([st.card.seat[0], st.card.seat[1], 0.04], Math.PI * fl);
    } else if (SHOT === 'r3') {
      st.logos.forEach((l, i) => l.update(t, { slice: i === 3 ? E.soft(seg(t, 1.0, 2.2)) - E.soft(seg(t, 3.0, 3.8)) : 0 })); st.mascot.update(t);
    } else if (SHOT === 'dome') {
      st.dome.update(t); st.orbit.update(t); st.worker.update(t);
      st.laptop.set({ open: 1, screen: 1, ui: { progress: +(0.3 + 0.6 * seg(t, 0, 4)).toFixed(2), title: 'Ideas' } });
    } else st.cast.forEach((w) => w.update(t));
  },
  camera(ctx, t) { const o = q.get('cam') ? JSON.parse(q.get('cam')) : null; return shot(ctx, t, o ? { ...SHOTS[SHOT], ...o } : SHOTS[SHOT]); },   // ?cam={...} overrides (QA close-ups)
  focus(ctx, t) { const o = q.get('cam') ? JSON.parse(q.get('cam')) : null; return o && o.target ? o.target : SHOT === 'devices' ? [0.1, 0.5, 0] : SHOT === 'dome' ? [0, 1.1, 0] : SHOT === 'r3' ? [0, 1.2, 0.3] : [0, 0.5, 0]; },
  subframes() { return 4; },
});
</script>
</body>
</html>
