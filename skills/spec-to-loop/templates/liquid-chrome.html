    beadFade: [95, 108], bead: [96, 123],

    chords: [[61.735, [246.94, 293.66, 369.99]], [48.999, [196.0, 246.94, 293.66]], [55.0, [220.0, 277.18, 329.63]], [73.416, [293.66, 369.99, 440.0]]],
    inhale: [66, 84], glide: [84, 112], glideHz: 190,
    pinchNotes: [1174.7, 987.77, 880.0, 1318.5, 1479.98, 739.99, 1567.98, 1975.5, 659.26, 1760.0],
    pourFrames: 'auto', pourDelay: 4, pourScale: [587.33, 659.26, 739.99, 880.0, 987.77, 1174.66, 1318.51, 1479.98, 1760.0, 1975.53],
    ting: 200, tingHz: 1760, shimmerEnd: 245, swell: [288, 303], dripHz: [1975.5, 1479.98],
    blupNotes: [220, 185, 164.81, 146.83, 130.81, 123.47, 110, 98], gloopHz: 110, slurpFrames: 11,

(function (C) {

  const busy = F => active.some(([a, b]) => { const g = ((F - a) % C.loopFrames + C.loopFrames) % C.loopFrames; return g <= b - a; });

  C.shakers.forEach((F, k) => ev.push({ id: 'shaker' + F, bus: 'bed', frame: F, voice: 'shaker', gain: L.shaker, pan: 0.3, seed: 500 + k }));
  ev.push({ id: 'inhale', bus: 'hits', frame: S.inhale[1], voice: 'noise', gain: L.inhale, pre: sec(S.inhale[1] - S.inhale[0]), pow: 2.2, release: 0.012, filter: { type: 'bp', f: [500, 2400], q: 1.2 }, seed: 1 });
  ev.push({ id: 'glide', bus: 'hits', frame: S.glide[0], voice: 'tone', gain: L.glide, pitch: { glide: [S.glideHz, S.glideHz * Math.pow(2, 1.25), sec(S.glide[1] - S.glide[0])] }, partials: [[1, 1], [2, 0.25]], attack: 0.003, len: 0.5, env: { cut: [0.9, 0.44, 0.49] } });
  T.pinch.forEach((F, i) => { const f0 = S.pinchNotes[i % S.pinchNotes.length]; ev.push({ id: 'pinch' + i, bus: 'hits', frame: F, voice: 'tone', gain: L.pinch, pan: panOf(i, necks), pitch: { approach: [f0, 1.5 * f0, 0.015] }, attack: 0.0015, decay: 0.045, len: 0.25 }); });
  pour.forEach((F, i) => { const p = S.pourScale[i % S.pourScale.length]; ev.push({ id: 'pour' + i, bus: 'hits', frame: F, voice: 'tone', gain: L.pour, pan: panOf(i, C.NG), pitch: { approach: [0.75 * p, p, 0.02] }, partials: [[1, 1], [2, 0.12]], attack: 0.002, decay: 0.07, len: 0.35 }); });
  ev.push({ id: 'ting', bus: 'hits', frame: S.ting, voice: 'tone', gain: L.ting, pitch: S.tingHz, partials: [[1, 1, 1.4], [2.32, 0.5, 0.7], [4.25, 0.25, 0.35]], attack: 0.0012, len: 1.6 });   // partials under 8 kHz
  ev.push({ id: 'shimmer', bus: 'hits', frame: S.ting, voice: 'texture', gain: L.shimmer, partials: [[3150, 1], [3730, 0.8], [4410, 0.7], [5290, 0.55], [6260, 0.4], [7380, 0.3]], dur: sec(S.shimmerEnd - S.ting) + 0.07, pan: -0.85, panTo: 0.85, seed: 777 });
  { const atk = sec(S.swell[1] - S.swell[0]);
    ev.push({ id: 'swell', bus: 'hits', frame: S.swell[1], voice: 'tone', gain: L.swell, pitch: { glideIn: [110, 110 * Math.pow(2, 0.58), atk] }, partials: [[1, 1], [2, 0.3]], attack: atk, decay: 0.12, len: 0.5 });

            partials: [[1, 1], [2, 0.2], [3, 0.08]], attack: 0.004, decay: 0.5, len: 1.2, am: { wobble: [0.3, T.wobble.hz, T.wobble.damping] } });

  C.qaFrames = [...new Set([0, ...T.squash, T.stretch[1], ...T.pinch, ...C.formFrames, T.glint[0], Math.round((T.glint[0] + T.glint[1]) / 2), T.swell[1], T.slumpEnd, ...T.merge, gl, C.loopFrames - 1])].sort((a, b) => a - b);
})(window.CONFIG);

<!-- ===== shared scene GLSL (raymarch AND mesh pass). Constants arrive as #defines generated from CONFIG. ===== -->
<script type="x-shader" id="scene">
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uSdf; uniform vec4 uTexRect; uniform vec2 uTexPx;
uniform vec4 uBlob, uBlobS; uniform float uBlobW, uPhase;
uniform vec4 uDrop[NG]; uniform vec4 uDropS[NG]; uniform vec4 uGOff[NG]; uniform vec4 uGR[NG]; uniform vec4 uGHome[NG]; uniform vec4 uGBox[NG];
uniform float uNeckK[NG];
uniform vec3 uCamPos; uniform float uGlintAz, uGlintI;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){

  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);

float smin(float a,float b,float k){ if(k<=1e-5) return min(a,b); float h=max(k-abs(a-b),0.0)/k; return min(a,b)-h*h*k*0.25; }

float blobSDF(vec3 p){

float dropSDF(int i, vec3 p){

// cubic B-spline SDF lookup (4 bilinear taps): C1 distance, so mirror normals do not facet at texel edges
vec4 texBicubic(vec2 uv){

float texD(vec2 xy, int ch){

float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }

  vec2 w=vec2(d2+soft, abs(q.z)-max(HALF_D-soft,0.0));

float mapObj(vec3 p){

    if(i==0) f=d; else f=smin(f,d,uNeckK[i-1]);

vec3 calcNormal(vec3 p){

float traceObj(vec3 ro, vec3 rd, float t0s){

float escapeT(vec3 ro, vec3 rd){          // secondary rays first step out of the shell they start in (no self-hit specks)

float boxAE(float az, float el, float caz, float cel, float haz, float hel, float s){

// analytic studio in azimuth/elevation; azimuth 0 = toward the camera's home position (+z), positive = camera right (+x)
vec3 env(vec3 d){
